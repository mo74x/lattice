version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lattice-postgres
    restart: always
    environment:
      POSTGRES_USER: lattice_user
      POSTGRES_PASSWORD: lattice_password
      POSTGRES_DB: lattice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lattice_user -d lattice_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lattice-redis
    restart: always
    command: redis-server --appendonly yes --requirepass lattice_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "lattice_redis_pass", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: